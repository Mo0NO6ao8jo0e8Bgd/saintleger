<header>
  <a href="../index.html" style="color: inherit; text-decoration: none;">
    <h1>Famille Saint-Léger / Wattinne</h1>
    <p>Site de généalogie familiale</p>
  </a>

  <div id="search-box">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="search" id="search-input" placeholder="Rechercher…" autocomplete="off">
    <div id="search-results"></div>
  </div>
</header>

<style>
header {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 1rem;
  padding: 0.5rem 1rem;
}

header a {
  grid-column: 2;
  text-align: center;
}

#search-box {
  grid-column: 3;
  justify-self: end;
  position: relative;
  display: flex;
  align-items: center;
  gap: 0.4rem;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.4);
  border-radius: 20px;
  padding: 0.3rem 0.7rem;
  color: inherit;
}

#search-box svg {
  flex-shrink: 0;
  opacity: 0.8;
}

#search-input {
  background: transparent;
  border: none;
  outline: none;
  color: inherit;
  font-size: 0.9rem;
  width: 160px;
  transition: width 0.3s;
}

#search-input::placeholder {
  color: inherit;
  opacity: 0.6;
}

#search-input:focus {
  width: 220px;
}

#search-results {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 320px;
  max-height: 400px;
  overflow-y: auto;
  background: white;
  color: #333;
  border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  display: none;
  z-index: 1000;
}

#search-results.visible {
  display: block;
}

.search-result-item {
  padding: 0.7rem 1rem;
  border-bottom: 1px solid #f0f0f0;
  cursor: pointer;
  text-decoration: none;
  display: block;
  color: #333;
}

.search-result-item:hover {
  background: #f5f5f5;
}

.search-result-item strong {
  display: block;
  font-size: 0.9rem;
}

.search-result-item span {
  font-size: 0.78rem;
  color: #888;
}

.search-no-result {
  padding: 0.7rem 1rem;
  color: #999;
  font-size: 0.85rem;
}

/* Mobile : empilement vertical */
@media (max-width: 600px) {
  header {
    grid-template-columns: 1fr;
    text-align: center;
  }
  header a {
    grid-column: 1;
  }
  #search-box {
    grid-column: 1;
    justify-self: center;
    width: 100%;
    max-width: 300px;
  }
  #search-input {
    width: 100% !important;
  }
  #search-results {
    left: 0;
    right: 0;
    width: 100%;
  }
}
</style>

<script>
if (!window._searchInitialized) {
  window._searchInitialized = true;

  (function() {
    var input = document.getElementById("search-input");
    var results = document.getElementById("search-results");
    var pagefind, timer;

    function getPagefind() {
      if (!pagefind) {
        return import("/pagefind/pagefind.js").then(function(pf) {
          pagefind = pf;
          return pagefind.init().then(function() { return pagefind; });
        });
      }
      return Promise.resolve(pagefind);
    }

    input.addEventListener("input", function() {
      clearTimeout(timer);
      var q = input.value.trim();
      if (q.length < 2) {
        results.classList.remove("visible");
        return;
      }
      timer = setTimeout(function() {
        getPagefind().then(function(pf) {
          return pf.search(q).then(function(search) {
            return Promise.all(search.results.slice(0, 8).map(function(r) { return r.data(); }));
          });
        }).then(function(items) {
          results.innerHTML = "";
          if (items.length === 0) {
            results.innerHTML = '<div class="search-no-result">Aucun résultat pour « ' + q + ' »</div>';
          } else {
            items.forEach(function(item) {
              var a = document.createElement("a");
              a.className = "search-result-item";
              a.href = item.url;
              a.innerHTML = "<strong>" + (item.meta.title || "Sans titre") + "</strong><span>" + item.excerpt + "</span>";
              results.appendChild(a);
            });
          }
          results.classList.add("visible");
        });
      }, 250);
    });

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        var q = input.value.trim();
        if (q.length < 2) return;
        window.location.href = "/recherche.html?q=" + encodeURIComponent(q);
      }
    });

    document.addEventListener("click", function(e) {
      var box = document.getElementById("search-box");
      if (box && !box.contains(e.target)) {
        results.classList.remove("visible");
      }
    });

  })();
}
</script>
