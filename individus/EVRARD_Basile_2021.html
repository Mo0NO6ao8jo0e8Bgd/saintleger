<script>
// Loader qui réexécute les <script> injectés via innerHTML
async function loadHTML(id, url, callback) {
    const res = await fetch(url);
    const html = await res.text();
    const el = document.getElementById(id);
    el.innerHTML = html;

    // innerHTML ne déclenche pas les <script> — on les recrée manuellement
    el.querySelectorAll("script").forEach(oldScript => {
        const newScript = document.createElement("script");
        if (oldScript.src) {
            newScript.src = oldScript.src;
            newScript.async = false;
        } else {
            newScript.textContent = oldScript.textContent;
        }
        document.body.appendChild(newScript);
        oldScript.remove();
    });

    if (callback) callback();
}

// Activation du mail dans le footer
function activateEmailLink() {
    const el = document.getElementById("email-contact");
    if (!el) return;
    const link = document.createElement("a");
    link.href = "mailto:saintleger.org@gmail.com";
    link.textContent = "Contact";
    el.replaceWith(link);
}
