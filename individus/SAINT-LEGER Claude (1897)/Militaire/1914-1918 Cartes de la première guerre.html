<script>
    
// Loader complet (identique aux autres pages)
async function loadHTML(id, url, callback) {
    const res = await fetch(url);
    document.getElementById(id).innerHTML = await res.text();
    if (callback) callback();
}

// Activation du lien mail dans le footer
function activateEmailLink() {
    const el = document.getElementById("email-contact");
    if (!el) return;
    const link = document.createElement("a");
    link.href = "mailto:arnaudsaintleger@gmail.com";
    link.textContent = "Contact";
    el.replaceWith(link);
}

// Chargement des partials
loadHTML("header", "../../../partials/header3.html");
loadHTML("menu", "../../../partials/menu3.html");
loadHTML("footer", "../../../partials/footer3.html", activateEmailLink);
</script>

<script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>

<script>
<!-- JS pour partials et Lightbox -->
    // Albums
    const Album1 = GLightbox({
        elements: [
            {href: 'IMG/Carte 1.jpg', title: ''},
            {href: 'IMG/Carte 2.jpg', title: ''},
            {href: 'IMG/Carte 3.jpg', title: ''},

            {href: 'IMG/Carte 7.jpg', title: ''},
            {href: 'IMG/Carte 8.jpg', title: ''},
        ],
        loop: true,
        touchNavigation: true
    });


    // Déclenchement au clic sur la miniature
    document.querySelector('.glightbox-Album1').addEventListener('click', function(e){
        e.preventDefault(); // empêche le # href par défaut
        Album1.open();
    });
</script>
