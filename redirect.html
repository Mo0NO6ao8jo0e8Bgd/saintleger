    <meta charset="UTF-8">
    <title>Redirection ou erreur 404</title>
    <script>
        // Charger le mappage des URLs
        fetch('/mapping.js')
            .then(response => response.text())
            .then(data => {
                eval(data); // Charge les correspondances

                // Récupérer le chemin actuel
                const currentPath = window.location.pathname.substring(1);

                // Vérifier si le chemin est dans le mappage
                if (pathMapping && pathMapping[currentPath]) {
                    // Rediriger vers le vrai chemin
                    window.location.replace('/' + pathMapping[currentPath]);
                } else {
                    // Afficher une vraie erreur 404
                    document.body.innerHTML = `
                        <h1>Erreur 404 : Page non trouvée</h1>
                        <p>La page que vous cherchez n'existe pas.</p>
                        <p><a href="/">Retour à l'accueil</a>.</p>
                        <p>Si vous pensiez accéder à une page spécifique, vérifiez l'URL ou <a href="mailto:saintleger.org@gmail.com">contactez-moi</a>.</p>
                    `;
                }
            })
            .catch(error => {
                console.error("Erreur de chargement du mappage :", error);
                // Afficher une erreur générique si le mappage ne charge pas
                document.body.innerHTML = `
                    <h1>Erreur</h1>
                    <p>Une erreur est survenue. <a href="/">Retour à l'accueil</a>.</p>
                `;
            });
    </script>
    
</head>
<body>

  <h1>404 – Page introuvable</h1>
  <p>La page demandée n’existe pas.</p>
  <p><a href="/">Retour à l’accueil</a></p>

</body>
