  <h1>Erreur 404 – Page introuvable</h1>

<!-- FOOTER -->
<div id="footer"></div>

<!-- JS pour inclure header, menu et footer -->
<script>
// Nouvelle fonction loadHTML avec callback possible
async function loadHTML(id, url, callback) {
    const res = await fetch(url);
    document.getElementById(id).innerHTML = await res.text();
    if (callback) callback();
}

// Fonction pour transformer le "Contact" en lien mail
function activateEmailLink() {
    const el = document.getElementById("email-contact");
    if (!el) return; // sécurité

    const email = "arnaudsaintleger@gmail.com";
    const link = document.createElement("a");
    link.href = "mailto:" + email;
    link.textContent = "Contact";

    el.replaceWith(link);
}

// Chargement des 3 parties, avec callback pour le footer
loadHTML("header", "partials/header.html");
loadHTML("menu", "partials/menu.html");
loadHTML("footer", "partials/footer.html", activateEmailLink);
</script>
