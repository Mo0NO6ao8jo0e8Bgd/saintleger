        .container {
            display: flex;          /* Affiche les éléments en ligne (côte à côte) */
            gap: 10px;             /* Espace entre les images */
            justify-content: center; /* Centre les images horizontalement */
            flex-wrap: wrap;        /* Permet le retour à la ligne si nécessaire */
        }

        .container img {
            width: 100%;           /* Largeur maximale de l'image */
            max-width: 400px;      /* Largeur maximale pour éviter qu'elles soient trop grandes */
            height: auto;          /* Garde les proportions */
        }

        /* Media query pour mobile (écran < 768px) */
        @media (max-width: 768px) {
            .container {
                flex-direction: column; /* Empile les images verticalement */
                align-items: center;     /* Centre les images horizontalement */
            }
        }
